name: Build RS41 RSM424 433.900 MHz

on:
  pull_request:
    branches: [main]
    paths:
      - "rs41-rsm424/**"
      - ".github/workflows/build-rs41-rsm424.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROBE_SERIAL: X0551026
  SENSOR_BOOM_SERIAL: X0852387
  PACKAGE_BASENAME: RSM424-X0551026-X0852387-AK5Z-433900-HorusV3-AGGRESSIVE-RAMLOG-v2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out build recipe
        uses: actions/checkout@v4

      - name: Fetch pinned RS41-NFW source
        run: |
          git clone https://github.com/Nevvman18/rs41-nfw.git nfw
          git -C nfw checkout 6b3c82936e0f3ebde21e92ee9aaa904087b5c035
          test "$(git -C nfw rev-parse HEAD)" = "6b3c82936e0f3ebde21e92ee9aaa904087b5c035"

      - name: Build pinned NFW compiler image
        run: |
          docker build -t rs41-nfw-builder nfw/rs41-nfw_souding-software/backend

      - name: Configure, instrument and compile RSM424 firmware
        run: |
          mkdir -p out
          chmod -R a+rwX nfw out

          docker run --rm \
            --entrypoint /bin/bash \
            -e PROBE_SERIAL="$PROBE_SERIAL" \
            -e SENSOR_BOOM_SERIAL="$SENSOR_BOOM_SERIAL" \
            -v "$GITHUB_WORKSPACE/nfw:/src" \
            -v "$GITHUB_WORKSPACE/rs41-rsm424:/job:ro" \
            -v "$GITHUB_WORKSPACE/out:/out" \
            rs41-nfw-builder -lc '
              set -euo pipefail
              export HOME=/home/builder
              CORE=/home/builder/.arduino15/packages/STMicroelectronics/hardware/stm32/2.10.1
              VARIANT_SRC="/src/fw/arduino-ide_variant-files/variants/STM32L4xx/L412RB(I-T)xP"
              VARIANT_DST="$CORE/variants/STM32L4xx/L412RB(I-T)xP"

              rm -rf "$VARIANT_DST"
              cp -a "$VARIANT_SRC" "$VARIANT_DST"
              if ! grep -q "GENERIC_L412RBTXP" "$CORE/boards.txt"; then
                printf "\n" >> "$CORE/boards.txt"
                cat /src/fw/arduino-ide_variant-files/boards.txt >> "$CORE/boards.txt"
              fi

              printf "Probe serial: %s\nSensor-boom calibration serial: %s\n" \
                "$PROBE_SERIAL" "$SENSOR_BOOM_SERIAL"

              python3 /job/build_config.py \
                /src/rs41-nfw_sonde-firmware/CONFIG.h \
                "$SENSOR_BOOM_SERIAL"

              python3 /job/instrument_ram_log.py \
                /src/rs41-nfw_sonde-firmware/rs41-nfw_sonde-firmware.ino

              arduino-cli compile \
                --fqbn "STMicroelectronics:stm32:GenL4:pnum=GENERIC_L412RBTXP,opt=osstd" \
                --output-dir /out \
                /src/rs41-nfw_sonde-firmware

              NM="$(find /home/builder/.arduino15/packages/STMicroelectronics/tools -type f -name arm-none-eabi-nm -print -quit)"
              test -x "$NM"
              ELF="$(find /out -maxdepth 1 -type f -name "*.elf" -print -quit)"
              test -n "$ELF"
              "$NM" -S -n "$ELF" | grep -E "nfwRamLog(NfwFramesOmitted|Write|Total)?$" > /out/RAMLOG-SYMBOLS.txt
              cat /out/RAMLOG-SYMBOLS.txt
              RING_SIZE="$(grep -E " nfwRamLog$" /out/RAMLOG-SYMBOLS.txt | tr -s " " | cut -d " " -f 2)"
              test "$RING_SIZE" = "00001000"
              test "$(wc -l < /out/RAMLOG-SYMBOLS.txt)" -eq 4
            '

      - name: Audit generated configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          cfg = Path('out/CONFIG.h').read_text()
          summary = json.loads(Path('out/build-summary.json').read_text())

          checks = {
              'RSM4x4 selected': r'^#define\s+RSM4x4\b',
              'RSM4x2 disabled': r'^//\s*#define\s+RSM4x2\b',
              'Horus V3 enabled': r'constexpr\s+bool\s+horusV3Enable\s*=\s*true\s*;',
              'Horus V3 period 60': r'horusV3TimeSyncSeconds\s*=\s*60\s*;',
              '433.900 MHz only in Horus V3 table': r'horusV3FreqTable\[\]\s*=\s*\{433\.9\}\s*;',
              'AK5Z callsign': r'#define\s+HORUS_V3_CALLSIGN\s+"AK5Z"',
              'Horus V3 power 3': r'horusV3RadioPower\s*=\s*3\s*;',
              'Horus V2 disabled': r'horusEnable\s*=\s*false\s*;',
              'APRS disabled': r'aprsEnable\s*=\s*false\s*;',
              'RTTY disabled': r'rttyEnable\s*=\s*false\s*;',
              'Morse disabled': r'morseEnable\s*=\s*false\s*;',
              'PIP disabled': r'pipEnable\s*=\s*false\s*;',
              'fox hunt disabled': r'foxHuntMode\s*=\s*false\s*;',
              'private landing disabled': r'privateLandingModeEnable\s*=\s*false\s*;',
              'RSM4x4 data recorder disabled': r'#ifdef\s+RSM4x4\s+bool\s+dataRecorderEnable\s*=\s*false\s*;',
              'factory temperature check': r'factoryTemperatureCheck\s*=\s*true\s*;',
              'factory humidity check': r'factoryHumidityCheck\s*=\s*true\s*;',
              'separate reconditioning disabled': r'reconditioningEnabled\s*=\s*false\s*;',
              'zero humidity recalibration disabled': r'zeroHumidityCalibration\s*=\s*false\s*;',
              'RPM411 pressure': r'pressureMode\s*=\s*1\s*;',
              'reference heater off': r'referenceHeating\s*=\s*false\s*;',
              'humidity heater off': r'humidityModuleHeating\s*=\s*false\s*;',
              'GPS mode 2': r'gpsOperationMode\s*=\s*2\s*;',
              'M10 cyclic tracking': r'm10CyclicTracking\s*=\s*true\s*;',
              'M10 cyclic 60 s': r'm10CyclicPeriodSec\s*=\s*60\s*;',
              'GLONASS secondary': r'gpsSecondaryGnss\s*=\s*2\s*;',
              'SBAS off': r'gpsSbasEnable\s*=\s*false\s*;',
              'XDATA log mode': r'xdataPortMode\s*=\s*1\s*;',
          }
          failed = []
          for label, pattern in checks.items():
              if not re.search(pattern, cfg, re.M | re.S):
                  failed.append(label)
          if failed:
              raise SystemExit('Configuration audit failed: ' + ', '.join(failed))

          cal = summary['factory_calibration']
          assert summary['probe_mainboard_serial'] == 'X0551026'
          assert summary['sensor_boom_calibration_serial'] == 'X0852387'
          assert cal['requested_serial'] == 'X0852387'
          assert cal['subframe_serial'] == 'X0852387'
          assert cal['mainboard'] == 'RSM424'
          assert cal['mainboard_serial'] == 'X0551026'
          assert summary['ram_debug_omits_bulk_nfw_frames'] is True
          print('Generated configuration audit: PASS')
          PY

      - name: Canonicalize and verify build products
        run: |
          set -euo pipefail

          ORIGINAL_BIN="$(find out -maxdepth 1 -type f -name 'rs41-nfw_sonde-firmware.ino.bin' -print -quit)"
          ORIGINAL_ELF="$(find out -maxdepth 1 -type f -name 'rs41-nfw_sonde-firmware.ino.elf' -print -quit)"
          ORIGINAL_HEX="$(find out -maxdepth 1 -type f -name 'rs41-nfw_sonde-firmware.ino.hex' -print -quit)"
          ORIGINAL_MAP="$(find out -maxdepth 1 -type f -name 'rs41-nfw_sonde-firmware.ino.map' -print -quit)"
          for f in "$ORIGINAL_BIN" "$ORIGINAL_ELF" "$ORIGINAL_HEX" "$ORIGINAL_MAP"; do test -s "$f"; done

          cp -- "$ORIGINAL_BIN" "out/${PACKAGE_BASENAME}.bin"
          cp -- "$ORIGINAL_ELF" "out/${PACKAGE_BASENAME}.elf"
          cp -- "$ORIGINAL_HEX" "out/${PACKAGE_BASENAME}.hex"
          cp -- "$ORIGINAL_MAP" "out/${PACKAGE_BASENAME}.map"
          rm -- "$ORIGINAL_BIN" "$ORIGINAL_ELF" "$ORIGINAL_HEX" "$ORIGINAL_MAP"

          test "$(stat -c %s "out/${PACKAGE_BASENAME}.bin")" -le 131072
          (cd out && sha256sum "${PACKAGE_BASENAME}.bin" > SHA256SUMS)
          cat out/SHA256SUMS

          cp rs41-rsm424/flash-openocd.sh out/flash-openocd.sh
          cp rs41-rsm424/dump-ram-log.sh out/dump-ram-log.sh
          cp rs41-rsm424/decode_ram_log.py out/decode_ram_log.py
          cp rs41-rsm424/README-aggressive.txt out/README.txt
          chmod 0755 out/flash-openocd.sh out/dump-ram-log.sh out/decode_ram_log.py
          bash -n out/flash-openocd.sh
          bash -n out/dump-ram-log.sh
          python3 -m py_compile out/decode_ram_log.py rs41-rsm424/build_config.py rs41-rsm424/instrument_ram_log.py
          rm -rf out/__pycache__ rs41-rsm424/__pycache__

          cat > out/DEVICE.txt <<EOF
          Canonical package: ${PACKAGE_BASENAME}.zip
          Probe / main electronics: ${PROBE_SERIAL}
          Sensor boom / calibration: ${SENSOR_BOOM_SERIAL}
          Board: RSM424 / STM32L412RBT6
          Frequency: 433.900 MHz
          Mode: Horus Binary V3
          Callsign: AK5Z
          Period: 60 seconds, GPS-clock aligned
          Startup PTU: factory temperature check + factory humidity reconditioning/check
          Zero-humidity recalibration: disabled
          RAM log: 4096-byte human-readable XDATA circular buffer; bulk \$NFW frames omitted
          EOF

          echo '--- final artifact contents ---'
          find out -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload canonical firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_BASENAME }}
          path: out/
          if-no-files-found: error
          retention-days: 14
